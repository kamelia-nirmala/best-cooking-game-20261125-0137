<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dapur Sizzle</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #120f0d;
      color: #f2e6d8;
      font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #gl {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 1280px;
      max-width: 100%;
      height: auto;
      z-index: 0;
      border-radius: 10px;
    }

    #game {
      position: relative;
      z-index: 1;
      width: 1280px;
      max-width: 100%;
      height: auto;
      background-color: transparent;
      border: 2px solid #3a2c25;
      border-radius: 10px;
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.65);
      image-rendering: pixelated;
      outline: none;
      touch-action: none;
    }
  </style>
</head>
<body>
  <canvas id="gl" width="1280" height="720"></canvas>
  <canvas id="game" width="1280" height="720" tabindex="0">Your browser does not support the HTML5 canvas element required for Dapur Sizzle.</canvas>
  <script src="./vendor/three.min.js"></script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
